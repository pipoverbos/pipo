<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipo y los verbos irregulares</title>
<link rel="preload" href="fonts/patrick-hand-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/caveat-brush-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Caveat Brush";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/caveat-brush-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Patrick Hand";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/patrick-hand-latin-400-normal.woff2") format("woff2")}
*{box-sizing:border-box}
:root{
  --cover:#2A9D8F;--cover-d:#1D6F66;
  --paper:#FBFAF2;--grid:#DCE8E3;--card:#FFFFFF;
  --ink:#1E2A44;--ink2:#51607C;--margin:#F2828D;
  --h0:#D6F06A;--h1:#8EDCF2;--h2:#CDAEF5;--h3:#FFF08A;
  --d0:#86A51C;--d1:#2A9CBC;--d2:#8658CF;--d3:#BFA400;
  --heart:#E8475F;--good:#2E9E68;--bad:#D9384C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --cover:#12332F;--cover-d:#0B201D;
    --paper:#16221F;--grid:#223531;--card:#1F302C;
    --ink:#EDF4F0;--ink2:#A9BDB6;--margin:#B95A66;
    --h0:#667F1C;--h1:#1F6E85;--h2:#68489F;--h3:#85761A;
    --d0:#A6C73C;--d1:#5CC4E3;--d2:#B28CF0;--d3:#E0C93A;
    --heart:#FF6B80;--good:#4CC58A;--bad:#FF7A8A;
  }
}
:root[data-theme="dark"]{
  --cover:#12332F;--cover-d:#0B201D;
  --paper:#16221F;--grid:#223531;--card:#1F302C;
  --ink:#EDF4F0;--ink2:#A9BDB6;--margin:#B95A66;
  --h0:#667F1C;--h1:#1F6E85;--h2:#68489F;--h3:#85761A;
  --d0:#A6C73C;--d1:#5CC4E3;--d2:#B28CF0;--d3:#E0C93A;
  --heart:#FF6B80;--good:#4CC58A;--bad:#FF7A8A;
}
html{background:var(--cover);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Patrick Hand","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.35;color:var(--ink);background:var(--cover);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Caveat Brush","Patrick Hand",cursive;font-weight:400;margin:0;line-height:1.05}
p{margin:0}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--d1);outline-offset:2px}

.sheet{position:relative;max-width:600px;margin:14px auto;padding:20px 16px 28px 40px;border-radius:18px;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;box-shadow:0 6px 0 var(--cover-d),0 16px 30px rgba(0,0,0,.28);min-height:calc(100vh - 36px)}
.sheet::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.75}
.hole{position:absolute;left:7px;width:15px;height:15px;border-radius:50%;background:var(--cover);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
@media (max-width:420px){.sheet{margin:8px;padding:16px 10px 24px 34px;border-radius:14px}.sheet::before{left:26px}.hole{left:5px}}

/* botones tipo pegatina */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 18px;border:2px solid var(--ink);border-radius:999px;background:var(--card);box-shadow:0 3px 0 var(--ink);font-size:19px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.main{background:var(--h3)}
.btn.go{background:var(--h0)}
.btn.cool{background:var(--h1)}
.btn.big{font-size:24px;min-height:56px;padding:10px 28px;font-family:"Caveat Brush","Patrick Hand",cursive}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:0 3px 0 var(--ink);transform:none}
.btn.small{min-height:40px;padding:4px 14px;font-size:17px}
.iconbtn{width:44px;height:44px;border:2px solid var(--ink);border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.iconbtn svg{width:22px;height:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{text-align:center;justify-content:center}
.mt{margin-top:16px}.mt2{margin-top:26px}
.muted{color:var(--ink2)}

/* resaltador */
.hl{padding:0 5px;background-image:linear-gradient(transparent 50%,var(--hc) 50%,var(--hc) 90%,transparent 90%);background-repeat:no-repeat;background-size:100% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.h0{--hc:var(--h0)}.h1{--hc:var(--h1)}.h2{--hc:var(--h2)}.h3{--hc:var(--h3)}
.hl.draw{animation:draw .55s ease-out}
@keyframes draw{from{background-size:0 100%}to{background-size:100% 100%}}

/* Pipo */
.pipo{display:block;width:100%;max-width:100%}
.pipo svg{display:block;width:100%;height:auto;animation:bob 2.8s ease-in-out infinite;transform-origin:50% 90%}
.pipo.m-dead svg{animation:none;transform:rotate(-9deg)}
.pipo.m-hurt svg{animation:hit .45s}
.pipo.m-cheer svg,.pipo.m-happy svg{animation:hop .9s ease-in-out infinite}
.pipo .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-4deg)}60%{transform:translateX(7px) rotate(4deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.talk{display:flex;gap:10px;align-items:flex-end}
.talk .pipo{flex:0 0 84px;width:84px}
.bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:18px;line-height:1.3}

/* carga */
.load{text-align:center;padding-top:6vh}
.load .pipo{width:170px;margin:0 auto}
.load h1{font-size:46px;margin-top:10px}
.load .sub{margin-top:6px;color:var(--ink2)}
.bar{height:20px;margin:22px auto 8px;max-width:320px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--h0);border-right:2px solid var(--ink);transition:width .25s}
.tipline{min-height:52px;max-width:360px;margin:12px auto 0;color:var(--ink2)}

/* conoce a pipo */
.meet h2{font-size:38px}
.meet .pipo{width:150px;margin:0 auto 6px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:0 3px 0 var(--ink)}
.dots{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--h3)}
.field{display:block;width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--card)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.legend span{display:block;padding:6px 10px;border-radius:8px 14px 9px 13px/12px 7px 13px 9px;text-align:center;font-family:"Caveat Brush","Patrick Hand",cursive;font-size:19px}

/* inicio */
.home h1{font-size:44px;text-align:center}
.home .stage{margin:12px 0 8px}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;min-height:46px;border:2px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--ink);font-size:19px}
.seg button.on{background:var(--h3);transform:translateY(-1px)}
.opt{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ink)}
.opt b{font-weight:400;font-size:20px;display:block}
.opt small{color:var(--ink2);font-size:16px}
.sec{font-size:28px;margin-top:20px}

/* encabezado de pantalla */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h2{font-size:34px;flex:1}

/* mis verbos */
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{min-height:40px;padding:4px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--card);font-size:17px}
.pill:active{background:var(--h3)}
.vwrap{display:flex;gap:8px;margin-top:8px}
.vrow{flex:1;display:flex;gap:10px;align-items:center;text-align:left;padding:8px 12px;min-height:56px;border:2px solid var(--ink);border-radius:12px;background:var(--card)}
.vrow.on{background:var(--h0)}
.chk{flex:0 0 24px;height:24px;border:2px solid var(--ink);border-radius:7px;background:var(--card);display:flex;align-items:center;justify-content:center}
.chk svg{width:16px;height:16px;opacity:0}
.vrow.on .chk svg{opacity:1}
.vrow b{font-weight:400}
.vrow small{display:block;color:var(--ink2);font-size:16px}
.vrow.on small{color:var(--ink)}
.tag{font-size:14px;padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;background:var(--h2);margin-left:6px}
details.card summary{cursor:pointer;font-family:"Caveat Brush","Patrick Hand",cursive;font-size:26px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:36px}
details.card summary::-webkit-details-marker{display:none}
.form{display:grid;gap:8px;margin-top:10px}
.form label{font-size:16px;color:var(--ink2);display:block;margin-bottom:2px}
.err{color:var(--bad);min-height:24px}
.okmsg{color:var(--good)}

/* mapa de niveles */
.lvl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:12px;padding:10px 12px;border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ink)}
.lvl:active:not(.lock){transform:translateY(3px);box-shadow:none}
.lvl.lock{opacity:.55;cursor:not-allowed}
.badge{flex:0 0 46px;height:46px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Caveat Brush","Patrick Hand",cursive;font-size:26px;background:var(--hc)}
.lvl b{font-family:"Caveat Brush","Patrick Hand",cursive;font-weight:400;font-size:24px;display:block;line-height:1.1}
.lvl small{font-size:16px;color:var(--ink2);display:block;line-height:1.25}
.lvl .body{flex:1}
.stars{display:flex;gap:2px}
.stars svg{width:22px;height:22px}

/* juego */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.hearts{display:flex;gap:3px;align-items:center}
.hearts svg{width:26px;height:24px}
.hearts .lost{opacity:.3}
.streak{display:flex;gap:4px;align-items:center;font-size:16px;color:var(--ink2)}
.pip{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.pip.on{background:var(--h0)}
.gtitle{flex:1;font-family:"Caveat Brush","Patrick Hand",cursive;font-size:26px;line-height:1.05}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.chip{min-height:44px;padding:6px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--card);box-shadow:0 2px 0 var(--ink);font-size:18px;cursor:grab}
.chip.sel{background:var(--h3);transform:translateY(-3px)}
.typebar{margin:14px 0 10px}
.typebar .row{flex-wrap:nowrap;margin-top:8px}
.typebar input{flex:1;min-width:0}
.vt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:4px}
.vt th{font-family:"Caveat Brush","Patrick Hand",cursive;font-weight:400;font-size:19px;line-height:1.05;padding:7px 2px;text-align:center;border-radius:8px 14px 9px 13px/12px 7px 13px 9px;background:var(--hc);color:var(--ink)}
.vt th:nth-child(odd){transform:rotate(-1.2deg)}.vt th:nth-child(even){transform:rotate(1deg)}
.vt td{height:48px;padding:2px;text-align:center;font-size:18px;line-height:1.1;word-break:break-word;border-radius:10px}
.vt td.slot{border:2.5px dashed var(--dc);color:var(--ink2);cursor:pointer;background:rgba(255,255,255,.18)}
.vt td.slot.cur{outline:3px solid var(--ink);outline-offset:1px;background:var(--card)}
.d0{--dc:var(--d0)}.d1{--dc:var(--d1)}.d2{--dc:var(--d2)}.d3{--dc:var(--d3)}
.shake{animation:sh .32s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.97)}to{transform:scale(1)}}

/* ventana */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,28,26,.62);overflow:auto}
.modal{width:100%;max-width:420px;background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:18px 16px;text-align:center;box-shadow:0 6px 0 var(--ink)}
.modal .pipo{width:130px;margin:0 auto}
.modal h2{font-size:38px;margin-top:4px}
.modal .stars{justify-content:center;margin:8px 0}
.modal .stars svg{width:38px;height:38px}
.modal .row{justify-content:center;margin-top:14px}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#conf i{position:absolute;top:-24px;border-radius:2px;animation:fall 2.5s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}
/* ===== tablet y escritorio ===== */
.hgrid{display:block}
.lgrid{display:block}
.gwrap{display:block}
@media (min-width:700px){
  .sheet{max-width:820px}
  .meet{max-width:560px;margin:0 auto}
}
@media (min-width:960px){
  body{font-size:19px}
  .sheet{max-width:1120px;margin:28px auto;padding:36px 48px 44px 84px;min-height:calc(100vh - 84px);border-radius:22px}
  .sheet::before{left:58px}
  .hole{left:18px;width:19px;height:19px}
  .load{padding-top:9vh}
  .load .pipo{width:220px}
  .load h1{font-size:64px}
  .tipline{font-size:20px;max-width:480px}
  .bar{max-width:440px}
  .meet{max-width:640px}
  .meet .pipo{width:190px}
  .meet h2{font-size:48px}
  .home h1{font-size:62px;text-align:left}
  .hgrid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-top:10px}
  .hleft{position:sticky;top:24px}
  .home .stage{flex-direction:column;align-items:center;margin:8px 0 12px}
  .home .stage .pipo{flex:none;width:230px}
  .home .bubble{width:100%;border-radius:20px;font-size:21px;text-align:center;padding:14px 18px}
  .home .sec:first-child,.hright .sec:first-child{margin-top:0}
  .top h2{font-size:46px}
  .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  .lvl{padding:14px 16px}
  .lvl b{font-size:28px}
  #vlist{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .form{grid-template-columns:1fr 1fr;gap:12px 16px}
  .form>p,.form>button{grid-column:1/-1}
  .form>button{justify-self:start}
  .gwrap{display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:start}
  .gside .talk{flex-direction:column;align-items:center}
  .gside .talk .pipo{flex:none;width:150px}
  .gside .bubble{width:100%;border-radius:20px;text-align:center;font-size:20px}
  .gside .hud{flex-direction:column;align-items:flex-start;gap:10px}
  .vt{border-spacing:6px}
  .vt th{font-size:26px;padding:10px 4px}
  .vt td{height:62px;font-size:22px}
  .chip{font-size:19px}
  .modal{max-width:480px}
}
@media (prefers-reduced-motion:reduce){
  .pipo svg,.pipo .eyes,.hl.draw,.shake,.pop{animation:none!important}
  .bar i{transition:none}
}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <span class="hole" style="top:16%"></span><span class="hole" style="top:48%"></span><span class="hole" style="top:80%"></span>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="conf"></div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var mem={};
var store={
  get:function(k,d){try{var v=localStorage.getItem("pipo2."+k);return v===null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
  set:function(k,v){mem[k]=v;try{localStorage.setItem("pipo2."+k,JSON.stringify(v))}catch(e){}}
};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

/* ---------- datos ---------- */
var BASE=[
["be","was / were","been","ser / estar","Was va con I, he, she, it. Were va con you, we, they.","Es el verbo más raro: tiene dos formas en el pasado simple."],
["become","became","become","convertir-se","El participio de become es igual que el infinitivo, como come.","Una de las formas es idéntica al infinitivo."],
["begin","began","begun","començar","Patrón i, a, u: begin, began, begun. Igual que drink.","Piensa en el patrón i, a, u."],
["break","broke","broken","trencar","Break, broke, broken. El participio acaba en -en.","Una forma es corta y la otra acaba en -en."],
["bring","brought","brought","portar","Bring, brought, brought: las dos formas llevan -ought.","Las dos formas son iguales y llevan -ought."],
["build","built","built","construir","Build cambia la d final por una t: built, built.","La d final se convierte en t."],
["buy","bought","bought","comprar","Buy hace bought, y bring hace brought. Las dos llevan -ought.","Rima con thought."],
["choose","chose","chosen","triar","Choose, chose, chosen. Chose lleva solo una o.","El pasado lleva una sola o; el participio acaba en -en."],
["come","came","come","venir","Come, came, come. El participio vuelve a ser como el infinitivo.","El participio vuelve a ser como el infinitivo."],
["cut","cut","cut","tallar","Cut, cut, cut: las tres formas son iguales.","¡No cambia nada!"],
["do","did","done","fer","Do, did, done. Done rima con one.","Una forma empieza por d-i y la otra rima con one."],
["draw","drew","drawn","dibuixar","Draw, drew, drawn. Drew rima con grew.","El pasado rima con grew; el participio acaba en -n."],
["drink","drank","drunk","beure","Drink, drank, drunk: patrón i, a, u, como begin.","Piensa en el patrón i, a, u."],
["drive","drove","driven","conduir","Drive, drove, driven. La i del infinitivo pasa a o en el pasado.","El pasado lleva una o; el participio acaba en -en."],
["eat","ate","eaten","menjar","Eat, ate, eaten. Ate se pronuncia como eit.","El pasado es muy corto; el participio acaba en -en."],
["fall","fell","fallen","caure","Fall, fell, fallen. La a pasa a e en el pasado y el participio acaba en -en.","El pasado cambia la a por e; el participio acaba en -en."],
["feel","felt","felt","sentir","Feel, felt, felt: las dos formas son iguales y acaban en -t.","Las dos formas son iguales y acaban en -t."],
["find","found","found","trobar","Find, found, found: la i pasa a ou y las dos formas son iguales.","Las dos formas son iguales y llevan ou."],
["fight","fought","fought","lluitar","Fight, fought, fought: lleva -ought, como buy y bring.","Lleva -ought, como bought."],
["fly","flew","flown","volar","Fly, flew, flown. Flew rima con grew; flown acaba en -n.","El pasado rima con grew; el participio acaba en -n."],
["forget","forgot","forgotten","oblidar","Forget, forgot, forgotten: el participio añade -ten.","El pasado pierde la e; el participio acaba en -ten."],
["freeze","froze","frozen","congelar","Freeze, froze, frozen: mismo patrón que choose, chose, chosen.","Mismo patrón que chose y chosen."],
["get","got","got","aconseguir","Get, got, got: las dos formas son iguales.","Las dos formas son iguales."],
["give","gave","given","donar","Give, gave, given. El participio acaba en -en.","El pasado empieza por ga-; el participio acaba en -en."],
["go","went","gone","anar","Go, went, gone: went no se parece a go, hay que memorizarlo.","El pasado no se parece nada al infinitivo."],

/* ---------- utilidades de verbos ---------- */
function custom(){return store.get("custom",[])}
function allV(){return BASE.concat(custom())}
function selSet(){var s=store.get("sel",null);if(!s)s=BASE.map(function(v){return v[0]});return new Set(s)}
function selV(){var s=selSet();return allV().filter(function(v){return s.has(v[0])})}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=1;j<=n;j++){d[0][j]=j}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function score(v){var p=v[1].split("/")[0].trim(),q=v[2].split("/")[0].trim();return lev(v[0],p)+lev(v[0],q)+(v[1].indexOf("/")>-1?3:0)}
function reg(w){w=w.split("/")[0].trim();if(/e$/.test(w))return w+"d";if(/[^aeiou]y$/.test(w))return w.slice(0,-1)+"ied";return w+"ed"}
function norm(s){return s.toLowerCase().replace(/[’]/g,"'").trim().replace(/\s+/g," ").replace(/\s*\/\s*/g,"/")}
function same(a,b){var f=function(s){return norm(s).split("/").map(function(x){return x.trim()}).sort().join("/")};return f(a)===f(b)}
function getStars(d){var s=store.get("stars."+d,[0,0,0,0,0]);return s}
function unlocked(i,d){return i===0||getStars(d)[i-1]>0}
function missMap(){return store.get("miss",{})}
function addMiss(inf){var m=missMap();m[inf]=(m[inf]||0)+1;store.set("miss",m)}

/* ---------- sonido y confeti ---------- */
var ac=null;
function snd(t){
  if(!store.get("sound",true))return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var now=ac.currentTime;
    var seq={ok:[[660,0,.09],[880,.09,.12]],bad:[[220,0,.16],[160,.12,.22]],up:[[523,0,.1],[659,.1,.1],[784,.2,.1],[1046,.3,.28]],
      life:[[784,0,.1],[988,.1,.1],[1318,.2,.22]],die:[[300,0,.2],[220,.2,.2],[150,.4,.4]],tap:[[520,0,.04]]}[t];
    seq.forEach(function(n){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type=(t==="bad"||t==="die")?"sawtooth":"triangle";o.frequency.value=n[0];
      g.gain.setValueAtTime(.0001,now+n[1]);g.gain.exponentialRampToValueAtTime(.11,now+n[1]+.02);g.gain.exponentialRampToValueAtTime(.0001,now+n[1]+n[2]);
      o.connect(g);g.connect(ac.destination);o.start(now+n[1]);o.stop(now+n[1]+n[2]+.03);
    });
  }catch(e){}
}
function confetti(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=$("#conf"),cols=["#D6F06A","#8EDCF2","#CDAEF5","#FFF08A","#F2828D"];
  for(var i=0;i<70;i++){
    var s=document.createElement("i");
    s.style.cssText="left:"+(Math.random()*100)+"%;background:"+cols[i%5]+";animation-delay:"+(Math.random()*.7)+"s;--dx:"+(Math.random()*140-70)+"px;--rot:"+(Math.random()*720)+"deg;width:"+(6+Math.random()*6)+"px;height:"+(10+Math.random()*8)+"px";
    c.appendChild(s);
    (function(el){setTimeout(function(){el.remove()},3400)})(s);
  }
}

  }).join("");
  $("#vlist").innerHTML=h||'<p class="muted mt">No hay ningún verbo con ese nombre.</p>';
  var n=selV().length;
  $("#vcount").textContent=n+(n===1?" verbo elegido":" verbos elegidos")+(n<MIN?" · necesitas al menos "+MIN+" para jugar":"");
}
function saveSel(set){store.set("sel",Array.from(set))}
function addVerb(){
  var g=function(id){return ($("#"+id).value||"").trim()};
  var inf=g("a-inf").toLowerCase(),p=g("a-past").toLowerCase(),pp=g("a-pp").toLowerCase(),m=g("a-mean"),t=g("a-tip");
  var re=/^[a-z' -]+(\s?\/\s?[a-z' -]+)?$/,msg=$("#amsg");
  msg.className="err";
  if(!inf||!p||!pp||!m){msg.textContent="Rellena el infinitivo, el pasado, el participio y el significado.";return}
  if(!/^[a-z' -]+$/.test(inf)||!re.test(p)||!re.test(pp)){msg.textContent="Escribe los verbos en inglés, solo con letras. Para dos formas usa /.";return}
  if(allV().some(function(v){return v[0]===inf})){msg.textContent="Ese verbo ya está en tu lista.";return}
  var c=custom();
  c.push([inf,p,pp,m,t||(inf+", "+p+", "+pp+": ¡que no se te olvide!"),"El pasado empieza por “"+p.charAt(0)+"”."]);
  store.set("custom",c);
  var s=selSet();s.add(inf);saveSel(s);
  ["a-inf","a-past","a-pp","a-mean","a-tip"].forEach(function(id){$("#"+id).value=""});
  msg.className="okmsg";msg.textContent="¡"+inf+" añadido y elegido!";
  S.vq="";$("#vq").value="";refreshVerbs();
}

/* ---------- mapa de niveles ---------- */
function levelDesc(i,d){
  var L=LV[i],g=L.gaps[d],t;
  if(i===4)t="Sin fichas: escribes tú "+g+(g===1?" forma":" formas")+" por fila";
  else{t=g+(g===1?" hueco":" huecos")+" por fila";if(i===2)t+=", y puede faltar el infinitivo";if(i===3)t+=", con "+L.tr[d]+" fichas trampa"}
  return t+".";
}
function mapView(v){
  var d=store.get("diff","normal"),stars=getStars(d),n=selV().length;
  var h='<section><div class="top"><button class="iconbtn" data-act="home" aria-label="Volver">'+ICON.back+'</button><h2>Elige un nivel</h2></div>'+
    '<p class="muted">Dificultad: <b>'+DIFFS[d]+'</b>. Supera un nivel para abrir el siguiente.</p><div class="lgrid">';
  for(var i=0;i<5;i++){
    var ok=unlocked(i,d);
    h+='<button class="lvl'+(ok?"":" lock")+'" data-act="level" data-i="'+i+'"'+(ok?'':' aria-disabled="true"')+'>'+
      '<span class="badge h'+(i%4)+'">'+(i+1)+'</span><span class="body"><b>'+LV[i].n+'</b><small>'+levelDesc(i,d)+'</small></span>'+
      (ok?starsHTML(stars[i]):ICON.lock)+'</button>';
  }
  h+='</div><p class="muted mt" style="font-size:16px">Cada nivel usa verbos distintos, de los más fáciles a los más difíciles de los '+n+' que elegiste.</p></section>';
  v.innerHTML=h;
}

/* ---------- juego ---------- */
function cfgFor(i){
  var d=store.get("diff","normal"),L=LV[i];
  return {n:L.n,cols:L.cols,g:L.gaps[d],tr:L.tr[d],type:L.type,intro:L.intro(L.gaps[d])};
}
function levelVerbs(i){
  var vs=selV().map(function(v){return [v,score(v)+Math.random()*.9]}).sort(function(a,b){return a[1]-b[1]}).map(function(x){return x[0]});
  var n=vs.length,base=Math.floor(n/5),rem=n%5,s=0,out=[];
  for(var k=0;k<5;k++){var sz=base+(k<rem?1:0);if(k===i){out=vs.slice(s,s+sz);break}s+=sz}
  if(out.length>8)out=shuffle(out.slice()).slice(0,8);
  return shuffle(out.slice());
}
function practiceVerbs(){
  var mm=missMap(),sel=selSet();
  return allV().filter(function(v){return sel.has(v[0])&&mm[v[0]]>0}).sort(function(a,b){return mm[b[0]]-mm[a[0]]}).slice(0,8);
}
function newLevel(cfg,idx,rows,keep){
  var lives=keep?R.lives:5,streak=keep?R.streak:0;
  R={cfg:cfg,idx:idx,rows:rows,hid:[],placed:{},chips:[],sel:null,selSlot:null,lives:lives,streak:streak,mis:0,done:false,dead:false,failed:{},total:0,last:null};
  R.hid=rows.map(function(){return new Set(shuffle(cfg.cols.slice()).slice(0,cfg.g))});
  rows.forEach(function(v,i){R.hid[i].forEach(function(f){R.total++;if(!cfg.type)R.chips.push({t:v[f],col:f,used:false})})});
  if(cfg.tr){
    var real={};rows.forEach(function(v){real[v[1]]=1;real[v[2]]=1});
    var c=[];rows.forEach(function(v){c.push(reg(v[0]));c.push(reg(v[1]))});
    c=shuffle(Array.from(new Set(c)).filter(function(x){return !real[x]})).slice(0,cfg.tr);
    c.forEach(function(t){R.chips.push({t:t,col:-1,used:false})});
  }
  shuffle(R.chips);
  S.screen="game";render();
  say(cfg.intro,"normal");
}
function startLevel(i,keep){newLevel(cfgFor(i),i,levelVerbs(i),keep)}
function startPractice(){
  var rows=practiceVerbs();if(rows.length<3)return;
  newLevel({n:"Repaso de errores",cols:[0,1,2,3],g:2,tr:0,type:false,intro:"Repaso de errores: practicamos los verbos que más se te resisten. ¡Sin prisa!"},-1,shuffle(rows.slice()),false);
}
function gameView(v){
  v.innerHTML='<section><div class="top"><button class="iconbtn" data-act="map" aria-label="Salir al mapa">'+ICON.back+'</button><div class="gtitle" id="gt"></div></div>'+
    '<div class="gwrap"><aside class="gside"><div class="hud" id="hud"></div>'+
    '<div class="talk" id="talk"></div><div id="tray"></div></aside><div class="gmain" id="tbl"></div></div></section>';
  $("#gt").textContent=(R.idx>=0?"Nivel "+(R.idx+1)+" · ":"")+R.cfg.n;
  renderHud();renderPlay();
}
function renderHud(){
  var h='<div class="hearts" aria-label="'+R.lives+' vidas">',slots=Math.max(5,R.lives);
  for(var i=0;i<slots;i++)h+=heartSVG(i>=R.lives);
  h+='</div><div class="streak" aria-label="Racha: '+R.streak+' de 10">';
  for(var j=0;j<10;j++)h+='<span class="pip'+(j<R.streak?" on":"")+'"></span>';
  h+='<span>+1 vida</span></div>';
  $("#hud").innerHTML=h;
}
function say(t,m){
  var el=$("#talk");if(!el)return;
  el.innerHTML=pipo(m||"normal")+'<div class="bubble pop" aria-live="polite"></div>';
  el.querySelector(".bubble").textContent=t;
}
function renderPlay(){
  var c=R.cfg,h="";
  if(!R.done&&!R.dead){
    if(c.type){
      h+='<div class="typebar">';
      if(R.selSlot===null)h+='<p class="muted">Toca una casilla de la tabla para escribir en ella.</p>';
      else{var p=R.selSlot.split("-");h+='<p>Escribe el <b>'+COLN[+p[1]]+'</b> de «'+esc(R.rows[+p[0]][3])+'»:</p><div class="row"><input class="field" id="ti" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Tu respuesta" aria-label="Tu respuesta"><button class="btn main" data-act="check">Comprobar</button></div>'}
      h+='</div>';
    }else{
      h+='<div class="tray" role="group" aria-label="Fichas">';
      R.chips.forEach(function(ch,k){if(!ch.used)h+='<button class="chip'+(R.sel===k?" sel":"")+'" data-chip="'+k+'" draggable="true">'+esc(ch.t)+'</button>'});
      h+='</div>';
    }
  }
  h+="<!--SPLIT-->";
  h+='<table class="vt"><colgroup><col style="width:22%"><col style="width:26%"><col style="width:26%"><col style="width:26%"></colgroup><tr><th class="h0">Infinitive</th><th class="h1">Past simple</th><th class="h2">Past participle</th><th class="h3">Significado</th></tr>';
  R.rows.forEach(function(v,i){
    h+='<tr>';
    for(var f=0;f<4;f++){
      var k=i+"-"+f;
      if(!R.hid[i].has(f))h+='<td><span class="hl h'+f+'">'+esc(v[f])+'</span></td>';
      else if(R.placed[k])h+='<td><span class="hl h'+f+(R.last===k?" draw":"")+'">'+esc(R.placed[k])+'</span></td>';
      else h+='<td data-slot="'+k+'" class="slot d'+f+(R.selSlot===k?" cur":"")+'">?</td>';
    }
    h+='</tr>';
  });
  h+='</table>';
  var parts=h.split("<!--SPLIT-->");$("#tray").innerHTML=parts[0];$("#tbl").innerHTML=parts[1]||"";
  if(R.selSlot!==null){var ti=$("#ti");if(ti)ti.focus()}
}
function shakeSlot(k){var el=document.querySelector('[data-slot="'+k+'"]');if(el)el.classList.add("shake")}

function success(key,txt,row,f){
  R.placed[key]=txt;R.last=key;R.streak++;snd("ok");
  var msg="¡Bien! "+(f<3?row[4]:row[0]+" significa "+row[3]+"."),mood="normal";
  if(R.streak>=10){R.streak=0;R.lives++;snd("life");msg="¡10 aciertos seguidos! Gano una vida. "+(f<3?row[4]:"");mood="cheer"}
  if(Object.keys(R.placed).length===R.total){finish();return}
  say(msg,mood);renderHud();renderPlay();
}
function fail(row,msg,key){
  R.lives--;R.streak=0;R.mis++;R.failed[row[0]]=1;addMiss(row[0]);
  if(R.lives<=0){R.dead=true;snd("die");renderHud();renderPlay();say("Me he quedado sin vidas en "+(R.idx>=0?"el nivel "+(R.idx+1):"el repaso")+".","dead");showDead();return}
  snd("bad");say(msg+" Pierdo una vida.","hurt");renderHud();renderPlay();shakeSlot(key);
}
function place(key){
  if(R.dead||R.done||R.placed[key])return;
  if(R.sel===null){say("Primero toca una ficha de arriba.","think");return}
  var p=key.split("-"),i=+p[0],f=+p[1],row=R.rows[i],ch=R.chips[R.sel];
  if(ch.t===row[f]){ch.used=true;R.sel=null;success(key,ch.t,row,f)}
  else{
    var msg;
    if(ch.col===-1)msg="¡Trampa! Esa forma no existe: los verbos irregulares no acaban en -ed.";
    else if(ch.col!==f)msg="Esa ficha es de otra columna. Mira los colores de la cabecera.";
    else if(f===3)msg="Ese significado es de otro verbo. Mira bien la fila.";
    else msg="Ese no encaja en "+row[0]+". Pista: "+row[5];
    R.sel=null;fail(row,msg,key);
  }
}
function check(){
  if(R.selSlot===null||R.dead||R.done)return;
  var ti=$("#ti");
  if(!ti||!ti.value.trim()){say("Escribe tu respuesta antes de comprobar.","think");return}
  var p=R.selSlot.split("-"),i=+p[0],f=+p[1],row=R.rows[i],key=R.selSlot;
  if(same(ti.value,row[f])){R.selSlot=null;success(key,row[f],row,f)}
  else fail(row,"Esa no es. Pista: "+row[5],key);
}
function finish(){
  R.done=true;
  var stars=R.mis===0?3:(R.mis<=2?2:1);
  if(R.idx>=0){
    var d=store.get("diff","normal"),s=getStars(d);
    if(stars>s[R.idx]){s[R.idx]=stars;store.set("stars."+d,s)}
  }else{
    var mm=missMap();Object.keys(R.failed).length;
    R.rows.forEach(function(v){if(!R.failed[v[0]])delete mm[v[0]]});store.set("miss",mm);
  }
  renderHud();renderPlay();snd("up");confetti();
  var last=R.idx===4,practice=R.idx<0;
  var title=last?"¡Has terminado el juego!":(practice?"¡Repaso completado!":"¡Nivel superado!");
  var txt=last?"Pipo se salva con "+R.lives+(R.lives===1?" vida":" vidas")+". ¡Eres una crack de los verbos!":(practice?"Los verbos que has acertado salen de tu lista de repaso.":(R.mis===0?"¡Sin ningún error!":"Has cometido "+R.mis+(R.mis===1?" error":" errores")+". ¡Sigue así!"));
  var btns='';
  if(!last&&!practice)btns+='<button class="btn go big" data-act="next">Siguiente nivel</button>';
  btns+='<button class="btn" data-act="'+(practice?"home":"map")+'">'+(practice?"Inicio":"Mapa de niveles")+'</button>';
  modal(pipo("cheer")+'<h2>'+title+'</h2>'+(practice?'':starsHTML(stars))+'<p>'+esc(txt)+'</p><div class="row">'+btns+'</div>');
  say(title,"cheer");
}
function showDead(){
  modal(pipo("dead")+'<h2>Pipo se ha quedado sin vidas</h2><p>No pasa nada, ¡los verbos irregulares cuestan! Inténtalo otra vez.</p><div class="row"><button class="btn go big" data-act="retry">Reintentar</button><button class="btn" data-act="'+(R.idx>=0?"map":"home")+'">'+(R.idx>=0?"Mapa de niveles":"Inicio")+'</button></div>');
}
function modal(h){$("#modal").innerHTML='<div class="ov" role="dialog" aria-modal="true"><div class="modal">'+h+'</div></div>'}
function closeModal(){$("#modal").innerHTML=""}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var t=e.target;
  var chip=t.closest("[data-chip]");
  if(chip&&R&&S.screen==="game"){
    var k=+chip.dataset.chip;snd("tap");R.sel=(R.sel===k?null:k);
    if(R.sel!==null)say("Llevas «"+R.chips[k].t+"». Busca su casilla en la tabla.","think");
    renderPlay();return;
  }
  var slot=t.closest("[data-slot]");
  if(slot&&R&&S.screen==="game"){
    var key=slot.dataset.slot;
    if(R.cfg.type){
      if(!R.placed[key]&&!R.dead&&!R.done){R.selSlot=key;var p=key.split("-");say("Escribe el "+COLN[+p[1]]+" de «"+R.rows[+p[0]][3]+"».","think");renderPlay()}
    }else place(key);
    return;
  }
  var a=t.closest("[data-act]");if(!a)return;
  var act=a.dataset.act;
  if(act!=="check")snd("tap");
  switch(act){
    case "meetnext":
      if(S.meet===0){var nm=$("#nm");if(nm)store.set("name",nm.value.trim())}
      if(S.meet<2){S.meet++;render()}else{store.set("seen",true);go("home")}
      break;
    case "meetback":S.meet=Math.max(0,S.meet-1);render();break;
    case "meetpipo":S.meet=0;go("meet");break;
    case "home":closeModal();R=null;go("home");break;
    case "play":if(selV().length>=MIN)go("map");break;
    case "diff":store.set("diff",a.dataset.d);render();break;
    case "sound":store.set("sound",!store.get("sound",true));render();break;
    case "verbs":S.vq="";S.del=null;go("verbs");break;
    case "pre":{
      var pr=a.dataset.p,s;
      if(pr==="all")s=new Set(allV().map(function(v){return v[0]}));
      else if(pr==="none")s=new Set();
      else if(pr==="l1")s=new Set(BASE.slice(0,15).map(function(v){return v[0]}));
      else if(pr==="l2")s=new Set(BASE.slice(15).map(function(v){return v[0]}));
      else s=new Set(custom().map(function(v){return v[0]}));
      saveSel(s);refreshVerbs();break;
    }
    case "tv":{var set=selSet(),inf=a.dataset.inf;if(set.has(inf))set.delete(inf);else set.add(inf);saveSel(set);refreshVerbs();break}
    case "del":{
      var di=a.dataset.inf;
      if(S.del===di){
        store.set("custom",custom().filter(function(v){return v[0]!==di}));
        var s2=selSet();s2.delete(di);saveSel(s2);S.del=null;
      }else S.del=di;
      refreshVerbs();break;
    }
    case "addverb":addVerb();break;
    case "level":{var i=+a.dataset.i;if(unlocked(i,store.get("diff","normal"))){startLevel(i,false)}break}
    case "practice":startPractice();break;
    case "map":closeModal();R=null;go("map");break;
    case "next":closeModal();startLevel(R.idx+1,true);break;
    case "retry":closeModal();if(R.idx>=0)startLevel(R.idx,false);else startPractice();break;
    case "check":check();break;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="vq"){S.vq=e.target.value;refreshVerbs()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="ti"){e.preventDefault();check()}
});
document.addEventListener("dragstart",function(e){
  var c=e.target.closest&&e.target.closest("[data-chip]");
  if(c&&R){R.sel=+c.dataset.chip;try{e.dataTransfer.setData("text/plain","x")}catch(err){}}
});
document.addEventListener("dragover",function(e){if(e.target.closest&&e.target.closest("[data-slot]"))e.preventDefault()});
document.addEventListener("drop",function(e){
  var s=e.target.closest&&e.target.closest("[data-slot]");
  if(s&&R&&!R.cfg.type){e.preventDefault();place(s.dataset.slot)}
});

render();
})();
</script>
</body>
</html>
